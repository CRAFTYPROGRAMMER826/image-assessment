[project]
name = "image-assessment"
version = "0.1.0"
description = "Deployable hybrid CV and ML image-quality assessment application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "joblib>=1.4,<2",
    "matplotlib>=3.9,<4",
    "numpy>=2.0,<2.5",
    "opencv-python-headless>=4.10,<5",
    "pandas>=2.2,<3",
    "python-multipart>=0.0.9,<1",
    "scikit-learn>=1.5,<2",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
